<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業者カコモン類題トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{--bg:#fff0dd;--fg:#5e4329;--muted:#8a6a48;--surface:#fffaf2;--line:#e2c9a6;--brown:#95714d;--rika:#c3e5cd;--shakai:#f6cfa5;--sugaku:#bcd7ee;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"BIZ UDPGothic",sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:clamp(26px,6vw,38px);margin:0;line-height:1.3}
p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:16px;background:var(--surface);border:2.5px solid var(--brown);color:var(--fg);text-decoration:none;box-shadow:0 3px 0 var(--brown)}
a.card:hover{background:var(--c);color:var(--fg)}
a.card b::before{content:"";display:inline-block;width:16px;height:24px;margin-right:8px;border-radius:50%/60% 60% 40% 40%;background:var(--c);border:2px solid var(--brown);transform:rotate(-20deg)}
a.card b{font-family:"Zen Maru Gothic",sans-serif;font-size:30px;color:inherit}
a.card span{font-size:14px}
</style>
<div class="wrap">
  <h1>業者カコモン<br>類題トレーニング</h1>
  <p>教科をえらんでね。問題を解いたら「解説を見る」で答えとポイントを確認しよう。</p>
  <div class="cards">
    <a class="card" href="rika/" style="--c:var(--rika)"><b>理科</b><span>生物・地学・化学・物理　全43単元</span></a>
    <a class="card" href="shakai/" style="--c:var(--shakai)"><b>社会</b><span>地理・歴史・公民・記述　全60単元</span></a>
    <a class="card" href="sugaku/" style="--c:var(--sugaku)"><b>数学</b><span>大問1・2・関数・図形・証明　全41単元</span></a>
  </div>
</div>
