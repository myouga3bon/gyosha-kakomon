<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業者テスト カコモン類題トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{--bg:#f3f5f2;--fg:#1d2420;--muted:#5d6a62;--surface:#fff;--line:#d5dcd6;--rika:#2f7d4f;--shakai:#a8552c}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--fg:#e8eee9;--muted:#9fb0a5;--surface:#1d2521;--line:#33403a;--rika:#6cc792;--shakai:#e39a6f}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"BIZ UDPGothic",sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:clamp(26px,6vw,38px);margin:0;line-height:1.3}
p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:16px;background:var(--surface);border:2px solid var(--c);color:var(--fg);text-decoration:none}
a.card:hover{background:var(--c);color:var(--surface)}
a.card b{font-family:"Zen Maru Gothic",sans-serif;font-size:30px;color:inherit}
a.card span{font-size:14px}
</style>
<div class="wrap">
  <h1>業者テスト<br>カコモン類題トレーニング</h1>
  <p>教科をえらんでね。問題を解いたら「解説を見る」で答えとポイントを確認しよう。</p>
  <div class="cards">
    <a class="card" href="rika/" style="--c:var(--rika)"><b>理科</b><span>生物・地学・化学・物理　全43単元</span></a>
    <a class="card" href="shakai/" style="--c:var(--shakai)"><b>社会</b><span>地理・歴史・公民・記述（作成中）</span></a>
  </div>
</div>
