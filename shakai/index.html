<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>社会　業者カコモン類題トレーニング</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#FFF0DF"><meta name="apple-mobile-web-app-title" content="社会カコモン">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 単元を選ぶ一覧 → 1枚の問題用紙を大きく見せ、解説ボタンで同じ用紙に解説を重ねる */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a62; --line:#d5dcd6;
  --accent:#2f6f4f; --accent-fg:#ffffff; --red:#d32a2f;
  --geo:#2f7d4f; --his:#a8552c; --civ:#2a62b5; --kij:#7a4aa8;
  --paper:#ffffff; --exp-bg:#e4f4fb; --exp-fg:#16323d; --pt:#1f5fd1;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- トップ ---------- */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.hero h1{font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1.25}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.subj header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subj h2{font-size:22px;color:var(--c)}
.subj header span{font-size:12px;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.unit{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);
  font-family:var(--display);font-size:20px;font-weight:700;display:grid;place-items:center;position:relative}
.unit[disabled]{cursor:default;opacity:.55}
.unit.ready{border-color:var(--c);background:var(--c);color:var(--surface)}
.unit.ready:hover{filter:brightness(1.08)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}

/* ---------- 単元ページ ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{border:none;background:none;color:var(--muted);padding:6px 4px;font-size:14px}
.bar h2{font-size:22px;color:var(--c);flex:1 1 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--c);color:var(--surface);font-weight:700}
.kbtn{border:none;border-radius:999px;padding:10px 22px;font-family:var(--display);font-weight:900;font-size:17px;
  background:var(--red);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.kbtn.on{background:var(--surface);color:var(--fg);border:2px solid var(--fg)}
.kbtn[hidden]{display:none!important}
.mode{font-size:13px;color:var(--muted)}
.sheet{position:relative;background:var(--paper);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);
  max-width:100%;overflow:hidden}
.sheet img{display:block;width:100%;height:auto}
.sheet svg{position:absolute;inset:0;width:100%;height:100%}
.sheet svg text{font-family:"BIZ UDPGothic",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.kview{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.kview.k{grid-template-columns:minmax(0,1fr) 320px}}
.sheet{container-type:inline-size}
.qb{position:absolute;transform:translateY(-50%);z-index:2;border:2px solid #fff;border-radius:999px;
  background:#1f5fd1;color:#fff;font-family:var(--body);font-weight:700;font-size:clamp(11px,1.9cqw,16px);
  padding:.2em .6em;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.qb.skip{background:#8a8f8c}
.qb .hard{font-size:.75em;background:#1e9a4a;border-radius:6px;padding:0 .3em;margin-left:.3em}
.qb[aria-pressed="true"]{background:#f2b705;color:#1d2420;outline:3px solid #1f5fd1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 100px);overflow:auto}}
@media (max-width:899px){
  .panel{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-height:45vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .panel.empty{display:none}
  .kview.k{padding-bottom:46vh}
}
.panel h3{font-size:20px;color:var(--c);display:flex;align-items:center;gap:8px}
.panel h3 button{margin-left:auto;border:none;background:var(--bg);color:var(--fg);border-radius:999px;width:32px;height:32px;font-size:16px}
.panel .a{font-weight:700;font-size:19px;margin:0;line-height:1.5}
.exp b{color:var(--red);font-weight:700}
.exp i{font-style:normal;font-weight:700;color:var(--pt);display:inline-block;margin-top:4px;border-bottom:2px solid var(--pt)}
.panel .hint{color:var(--muted);margin:0}
.panel .skipa{color:var(--red)}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ans h3{font-size:18px;margin-bottom:8px}
.ans ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ans li{display:grid;grid-template-columns:4.2em 1fr;gap:8px;min-width:0}
.ans li b{color:var(--c);font-variant-numeric:tabular-nums}
.ans small{color:var(--muted)}
.ans ol{gap:14px}
.ans .a{display:flex;flex-direction:column;gap:6px;min-width:0}
.ans .a>span{font-weight:700}
.exp{margin:0;font-size:14px;line-height:1.9!important;background:var(--exp-bg);color:var(--exp-fg);border-radius:10px;padding:10px 14px;line-height:1.75}
.skip span{color:var(--red);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}
.cimg{display:block;max-width:100%;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.sheet.rot img{transform:rotate(90deg)}
@media (max-width:560px){.bar h2{flex-basis:100%}}
@media (prefers-reduced-motion:no-preference){.sheet svg{transition:opacity .2s}}
.switch{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:700;text-decoration:none}
.switch:hover{background:var(--accent);color:var(--accent-fg)}
.bar .switch{padding:4px 12px;font-size:13px}

/* ===== ロゴ（イナサト Flick Reading）のテイスト：クリーム地・茶色の文字・パステルの葉 ===== */
:root{
  --bg:#fff0dd; --surface:#fffaf2; --fg:#5e4329; --muted:#8a6a48; --line:#e2c9a6; --brown:#95714d;
  --accent:#95714d; --accent-fg:#fffaf2; --red:#d6453d;
  --exp-bg:#fff6e4; --exp-fg:#4a3420; --pt:#2f6fc0;
  --leaf-pink:#f4c3c8; --leaf-orange:#f6cfa5; --leaf-yellow:#fbeaa6; --leaf-green:#c3e5cd; --leaf-blue:#bcdcf3; --leaf-lav:#d9cdf1;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body)}
.hero{align-items:flex-start;gap:8px}
.hero .top{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap}
.hero .sprig{width:44px;height:52px;flex:none}
.hero h1 .w{display:inline-block}
.hero .eyebrow{flex:1 1 0;min-width:0;color:var(--muted);font-family:var(--display);font-weight:700}
.hero h1{color:var(--fg);font-size:clamp(22px,4.6vw,34px);line-height:1.35}
.hero h1 .subj-name{display:inline-block;background:var(--leaf-c);border:2.5px solid var(--brown);border-radius:999px;padding:0 .5em;margin-right:.35em}
.hero p{color:var(--muted)}
.switch{margin-left:auto;align-self:center;border:2.5px solid var(--brown);color:var(--fg);background:var(--sw);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:900;text-decoration:none;box-shadow:0 2px 0 var(--brown)}
.switch:hover{background:var(--sw);color:var(--fg);filter:brightness(1.04);transform:translateY(-1px)}
.subj{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.subj header{border-bottom:2px dashed var(--line);padding-bottom:8px}
.subj h2{color:var(--fg);display:flex;align-items:center;gap:8px}
.subj h2::before{content:"";width:18px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);border:2px solid var(--brown);transform:rotate(-20deg)}
.subj header span{color:var(--muted)}
.units{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.unit{aspect-ratio:auto;display:flex;align-items:center;gap:5px;text-align:left;padding:5px 7px;min-height:40px;border-radius:12px;border:2px solid var(--brown);background:var(--surface);color:var(--fg);font-size:17px;line-height:1.15}
.unit.ready{border-color:var(--brown);background:var(--c);color:var(--fg)}
.unit.ready:hover{filter:brightness(1.03);transform:translateY(-1px)}
.unit .n{font-family:var(--display);font-weight:900;font-size:18px;flex:none}
.unit .lb{font-family:var(--body);font-weight:700;font-size:10.5px;line-height:1.25;color:#5e4329;word-break:keep-all;overflow-wrap:anywhere}
.legend{display:none}
.bar{background:var(--bg);border-bottom:2px solid var(--line)}
body::before{background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--brown);background:var(--leaf-yellow);color:var(--fg);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:900;font-size:15px;box-shadow:0 2px 0 var(--brown)}
.back:hover{filter:brightness(1.03)}
.bar h2{color:var(--fg)}
.bar h2 small{font-size:13px;color:var(--muted);font-family:var(--body);margin-left:6px}
.tab{border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.tab[aria-selected="true"]{border-color:var(--brown);background:var(--c);color:var(--fg)}
.kbtn{background:#f08f7a;color:#fff;border:2.5px solid var(--brown);box-shadow:0 2px 0 var(--brown);text-shadow:0 1px 0 rgba(0,0,0,.15)}
.kbtn.on{background:var(--surface);color:var(--fg);border:2.5px solid var(--brown);text-shadow:none}
.mode{color:var(--muted)}
.sheet{box-shadow:0 1px 4px rgba(94,67,41,.25)}
.panel{background:var(--surface);border:2px solid var(--brown)}
.panel h3{color:var(--fg)}
.panel h3 button{background:var(--bg);color:var(--fg)}
.exp{border:1.5px dashed var(--line)}
.ans{background:var(--surface);border:2px solid var(--line)}
.ans li b{color:var(--fg)}
:root{--geo:var(--leaf-green);--his:var(--leaf-pink);--civ:var(--leaf-blue);--kij:var(--leaf-lav)}
/* ---------- テーマ別対策 ---------- */
.themebtn{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:2px;align-items:center;background:var(--leaf-yellow);border:2.5px solid var(--brown);border-radius:18px;padding:14px 18px;color:var(--fg);text-decoration:none;box-shadow:0 3px 0 var(--brown)}
.themebtn b{font-family:var(--display);font-weight:900;font-size:22px}
.themebtn span{font-size:13px;color:var(--muted)}
.themebtn i{grid-column:2;grid-row:1/3;font-style:normal;font-family:var(--display);font-weight:900;font-size:20px}
.themebtn:hover{filter:brightness(1.03);transform:translateY(-1px)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;border:2px solid var(--brown);border-radius:12px;background:var(--c);color:var(--fg);padding:8px 10px;font-family:var(--display);font-weight:700;font-size:14px;line-height:1.3}
.theme:hover{filter:brightness(1.03);transform:translateY(-1px)}
.theme .tc{flex:none;font-family:var(--body);font-size:11px;background:var(--surface);border:1.5px solid var(--brown);border-radius:999px;padding:0 7px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tu{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--c);border:2px solid var(--brown);align-self:flex-start}
.tu b{font-family:var(--display);font-size:16px}
.tu small{font-size:12px;color:var(--fg)}
.ti{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tq{font-weight:700;flex:1 1 auto}
.tq .hard{font-size:11px;background:#1e9a4a;color:#fff;border-radius:6px;padding:0 5px}
.tgo,.tans{border:2px solid var(--brown);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--fg);text-decoration:none;background:var(--leaf-yellow)}
.tans{background:#f08f7a;color:#fff}
.tans[aria-expanded="true"]{background:var(--surface);color:var(--fg)}
.tbody{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.tbody[hidden]{display:none}
.tbody .a{font-weight:700;margin:0}
.crop{position:relative;overflow:hidden;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.same{margin:6px 0 0;font-size:13px;color:var(--muted)}
.crop img{max-width:none;position:absolute;top:0;left:0;width:100%;height:auto;display:block}
.qmark{position:absolute;left:0;transform:translateY(-50%);z-index:3;background:#f08f7a;color:#fff;border:2px solid #fff;border-radius:999px;padding:.15em .6em;font-weight:700;font-size:clamp(11px,1.9cqw,16px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.guide{background:var(--surface);border:2.5px solid var(--brown);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.guide>h3{font-size:19px;display:flex;align-items:center;gap:8px}
.guide>h3::before{content:"";width:14px;height:20px;border-radius:50%/60% 60% 40% 40%;background:var(--c);border:2px solid var(--brown);transform:rotate(-20deg)}
.guide h4{margin:8px 0 2px;font-family:var(--display);font-size:15px;display:inline-block;align-self:flex-start;background:var(--c);border-radius:999px;padding:1px 12px}
.guide h4.t2{background:var(--leaf-yellow)}
.guide h4.t3{background:#fbd5cf}
.guide ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px;font-size:15px;line-height:1.75}
.guide b{color:var(--red)}
.guide i{font-style:normal;font-weight:700;color:var(--pt);border-bottom:2px solid var(--pt)}
.guide details summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
.themebtn{display:inline-flex;align-self:flex-end;gap:6px;padding:6px 16px;border-radius:999px;box-shadow:0 2px 0 var(--brown);margin-top:-12px}
.themebtn b{font-size:15px}
.themebtn i{font-size:13px}
</style>

<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="crops.js"></script>

<script>
/* ===== 単元一覧（PDFの並び順どおり。1単元＝問題2枚＋解答用紙＋解説入り2枚） ===== */
const SUBJECTS=[
  {key:'geo', name:'地理', sub:'世界と日本の地理', n:18, color:'--geo'},
  {key:'his', name:'歴史', sub:'古代から現代まで', n:16, color:'--his'},
  {key:'civ', name:'公民', sub:'政治・経済・国際', n:16, color:'--civ'},

  const [k,...a]=it, c=v=>COL[v]||v;
  switch(k){
    case 'h': return `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" fill="#ffe600" opacity=".45" style="mix-blend-mode:multiply"/>`;
    case 't': return T(a[0],a[1],a[2],c(a[3]),a[4],a[5]||'start');
    case 'tl': return TL(a[0],a[1],a[2],c(a[3]),a[4],a[5]||1.3);
    case 'o': return O(a[0],a[1],a[2],a[3],c(a[4]||'R'));
    case 'u': return U(a[0],a[1],a[2]);
    case 'img': return `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" fill="#fff"/><image href="${a[4]}" x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}"/>`;
    case 'bx': return BOX(a[0],a[1],a[2],a[3],c(a[4]||'R'));
    case 'f': return `<ellipse cx="${a[0]}" cy="${a[1]}" rx="${a[2]}" ry="${a[3]}" fill="${R}" opacity=".85"/>`;
    case 'l': return L(a[0],a[1],a[2],a[3],c(a[4]||'R'),a[5]||3,!!a[6]);

}

 t:['「出荷時期がずれる＝ほかの産地が少ない時期に高い価格で売れる」が答えの決まり文句。','果樹：りんご＝青森・長野、みかん＝和歌山・愛媛・静岡、ぶどう・もも＝山梨（扇状地）。','<b>潮目</b>：暖流と寒流がぶつかる所。プランクトンが多く好漁場（三陸沖）。','世界：<b>プランテーション</b>（熱帯の大農園）、アメリカの<b>適地適作</b>・大規模農業。'],
 m:['食料自給率：米は高いが、小麦・大豆はとても低い。','記述では「時期」と「価格」の両方を書く。']},
kogyo:{k:['工業地帯：<b>中京</b>（出荷額日本一・自動車）、<b>阪神</b>（金属・中小工場）、<b>京浜</b>。工業地域：北九州・瀬戸内・東海・北関東など。','<b>太平洋ベルト</b>：工業の中心。原料の輸入・製品の輸出に便利な<b>臨海部</b>。','資源：日本は原油・鉄鉱石・石炭のほとんどを<b>輸入</b>（原油＝西アジア、鉄鉱石・石炭＝オーストラリア）。'],
 t:['北関東工業地域：<b>高速道路</b>沿いに工業団地 → 内陸でも発展。','瀬戸内工業地域：<b>石油化学コンビナート</b>（倉敷市水島など）。','発電：水力＝山地、火力＝都市近くの臨海部、原子力＝海沿い（冷却水）。','<b>再生可能エネルギー</b>：太陽光・風力・地熱・水力・バイオマス。二酸化炭素を出さない・なくならない。','<b>産業の空洞化</b>：工場が海外に移り、国内の産業が衰える。'],
 m:['北九州は八幡製鉄所から始まったが、今は自動車工業も。','フランスは原子力、ブラジルは水力の割合が高い。']},
shizen:{k:['<b>環太平洋造山帯</b>（日本・ロッキー・アンデス）と<b>アルプス・ヒマラヤ造山帯</b>。','日本の川は短く急流。<b>扇状地</b>（山のふもと・果樹園）、<b>三角州</b>（河口・水田や都市）。','海流：太平洋側の暖流＝<b>黒潮（日本海流）</b>、寒流＝<b>親潮（千島海流）</b>。日本海側の暖流＝<b>対馬海流</b>、寒流＝リマン海流。','<b>フォッサマグナ</b>：日本列島を東西に分ける大きなみぞ。'],
 t:['<b>ハザードマップ</b>（防災マップ）：被害の予測・避難場所・避難経路を示した地図。','リアス海岸：入り組んだ海岸（三陸・志摩）。波がおだやかで養殖に向く。','<b>カルデラ</b>：噴火でできた大きなくぼ地（阿蘇山）。','<b>フィヨルド</b>：氷河がけずった谷に海水が入った湾（ノルウェー）。','ヒートアイランド現象：都市の中心部の気温が周りより高くなる。'],
 m:['利根川＝流域面積日本一、信濃川＝長さ日本一。','<i>防災は「自助・共助・公助」</i>']},
sekai:{k:['6つの州：<b>アジア・ヨーロッパ・アフリカ・北アメリカ・南アメリカ・オセアニア</b>。','三大宗教：<b>仏教・キリスト教・イスラム教</b>（イスラム教：豚肉・酒を口にしない、1日5回の礼拝）。インドは<b>ヒンドゥー教</b>（牛を神聖視）。','EU（ヨーロッパ連合）：共通通貨<b>ユーロ</b>、国境の行き来が自由。ASEAN（東南アジア諸国連合）。'],
 t:['ヨーロッパ：北西部はゲルマン系・プロテスタント、南部はラテン系・カトリック、東部はスラブ系・正教会。','アフリカ：植民地時代の国境線（直線）、特定の産物の輸出にたよる<b>モノカルチャー経済</b>。','中国：<b>経済特区</b>（沿岸部）・一人っ子政策、内陸との経済格差。','オーストラリア：<b>白豪主義</b>から<b>多文化社会</b>へ。アボリジニ。貿易相手はイギリス→<b>アジア</b>へ。','アメリカ：<b>サンベルト</b>（北緯37度以南・先端技術産業）、<b>適地適作</b>。','南アメリカ：ブラジルは<b>ポルトガル語</b>、他の多くはスペイン語。'],
 m:['国名だけでなく、資料の特徴（言語・宗教・輸出品）から国を判断できるように。','<i>ブラジルだけポルトガル語</i>']},
nihon:{k:['7地方区分：<b>北海道・東北・関東・中部・近畿・中国四国・九州</b>。','県庁所在地名が県名とちがう県（札幌・盛岡・仙台・水戸・宇都宮・前橋・さいたま・横浜・金沢・甲府・名古屋・津・大津・神戸・松江・高松・松山・那覇）。'],
 t:['北海道：<b>アイヌ</b>の人々、<b>開拓使</b>・屯田兵、大規模な畑作・酪農。','東北：<b>やませ</b>・冷害、夏祭り（ねぶた・竿燈・七夕）、伝統工芸。','関東：<b>関東ローム</b>（火山灰の赤土）、近郊農業、昼間人口（東京は通勤・通学で昼に多い）。','中部：中京工業地帯、北陸の稲作（単作）、中央高地の果樹・高原野菜、東海の園芸。','近畿：古都（京都・奈良）の<b>景観を守る条例</b>、阪神工業地帯、紀伊山地の林業。','中国四国：瀬戸内、本州四国連絡橋、過疎化。九州：地熱発電、シラス台地の畜産、促成栽培。'],
 m:['海に面していない県（内陸県）：栃木・群馬・埼玉・山梨・長野・岐阜・滋賀・奈良の8県。','<i>地方の問題は「気候・産業・課題」の3点セット</i>']},
kodai:{k:['<b>縄文</b>（土器・たて穴住居・貝塚）→ <b>弥生</b>（稲作・金属器・高床倉庫・クニ）→ <b>古墳</b>（大和政権・前方後円墳）。','<b>飛鳥</b>：聖徳太子（冠位十二階・十七条の憲法・遣隋使）、<b>大化の改新</b>（中大兄皇子・中臣鎌足・645年）。','<b>奈良</b>：<b>大宝律令</b>、平城京、<b>班田収授法</b>（口分田）、<b>墾田永年私財法</b>（743年）→ 荘園のはじまり、天平文化（東大寺・正倉院）。','<b>平安</b>：<b>摂関政治</b>（藤原道長）、<b>国風文化</b>（かな文字・源氏物語）、院政。'],
 t:['税：<b>租</b>（稲）、<b>調</b>（特産物）、<b>庸</b>（布）。','摂政＝天皇が<b>幼い</b>とき、関白＝天皇が<b>成人</b>してから政治を補佐。','藤原氏は娘を天皇の<b>きさき</b>にし、生まれた子を天皇にして力をもった。','遣唐使の停止（894年・菅原道真）→ 国風文化が発展。'],
 m:['墾田永年私財法で「土地を<b>永久に私有</b>できる」→ 公地公民がくずれる。','<i>「なんと（710）大きな平城京」「なくよ（794）うぐいす平安京」</i>']},
chusei:{k:['<b>鎌倉</b>：源頼朝、<b>御恩と奉公</b>、守護・地頭、<b>承久の乱</b>（1221年）→ <b>六波羅探題</b>、<b>御成敗式目</b>（北条泰時）、元寇。','<b>室町</b>：足利尊氏、<b>日明貿易（勘合貿易）</b>（足利義満・勘合で倭寇と区別）、<b>応仁の乱</b> → 戦国時代（<b>下剋上</b>）。','産業：<b>二毛作</b>・牛馬耕・定期市・<b>座</b>・土倉・酒屋。'],
 t:['御恩＝将軍が領地を保障・与える、奉公＝御家人が戦いで命がけで働く。','承久の乱のあと、朝廷を監視するため京都に六波羅探題を置いた。','永仁の徳政令：御家人の<b>借金を帳消し</b>に。土一揆も徳政を求めた。','文化：鎌倉＝<b>東大寺南大門</b>・金剛力士像・新古今和歌集、室町＝<b>金閣（北山）・銀閣（東山）</b>・<b>書院造</b>・水墨画（雪舟）・能。'],
 m:['地頭は荘園の年貢の取り立て → 農民は荘園領主と地頭の<b>二重の支配</b>。','<i>建武の新政（後醍醐天皇）は2年ほどでくずれた</i>']},
kinsei:{k:['<b>織田信長</b>：<b>楽市・楽座</b>（市の税を免除・座の特権を廃止）、キリスト教保護。<b>豊臣秀吉</b>：<b>太閤検地</b>（石高）・<b>刀狩</b> → <b>兵農分離</b>。','<b>江戸</b>：参勤交代（武家諸法度）、<b>鎖国</b>（オランダ・中国と長崎で貿易）。','三大改革：<b>享保</b>（徳川吉宗・目安箱・公事方御定書）、<b>寛政</b>（松平定信）、<b>天保</b>（水野忠邦・株仲間解散）。','田沼意次：<b>株仲間</b>の結成を奨励、商業重視。'],
 t:['鎖国の目的：<b>キリスト教の禁止</b>と、幕府が貿易を<b>独占</b>するため。','オランダ風説書で海外の情報を得た。','文化：元禄（上方・井原西鶴・近松門左衛門・菱川師宣）、化政（江戸・<b>錦絵</b>・葛飾北斎・歌川広重）。','異国船打払令（1825年）→ アヘン戦争を知って緩和。'],
 m:['朱印船貿易（江戸初期）→ 東南アジアに日本町。鎖国で終わる。','農具の改良：<b>備中ぐわ</b>（深く耕す）、<b>千歯こき</b>（脱穀）。']},
kindai:{k:['<b>開国</b>：日米和親条約（1854年）・<b>日米修好通商条約</b>（1858年・<b>領事裁判権</b>を認め、<b>関税自主権</b>がない不平等条約）。','<b>明治維新</b>：大政奉還・王政復古、<b>廃藩置県</b>、<b>学制・徴兵令・地租改正</b>（地価の3％を<b>現金</b>で）、<b>富国強兵・殖産興業</b>（富岡製糸場）。','自由民権運動 → 国会開設の勅諭 → <b>大日本帝国憲法</b>（1889年）→ 帝国議会。','日清戦争（下関条約）→ 三国干渉、日露戦争（ポーツマス条約）。条約改正：陸奥宗光（領事裁判権の撤廃）、小村寿太郎（関税自主権の回復）。','大正デモクラシー、世界恐慌、満州事変、第二次世界大戦 → 戦後改革（農地改革・日本国憲法）→ <b>高度経済成長</b>。'],
 t:['地租改正の目的：税を<b>現金</b>で納めさせ、政府の収入を<b>安定</b>させる。','年代の並べかえは「どの戦争の前か後か」を軸にする。','産業革命：<b>軽工業</b>（生糸・綿糸）→ <b>重工業</b>（八幡製鉄所・1901年）。','高度経済成長（1955〜73年）：公害問題 → 公害対策基本法・環境庁。石油危機で終わる。'],
 m:['領事裁判権＝外国人が日本で罪をおかしても日本の法で裁けない。関税自主権＝輸入品の税率を自分で決める権利。','<i>1858年の条約は「不平等」の2点セットで覚える</i>']},
gaiko:{k:['古代：<b>遣隋使</b>（小野妹子）、<b>遣唐使</b>（894年に停止）、白村江の戦い（663年・唐と新羅に敗れる）。','中世：<b>日宋貿易</b>（平清盛・宋銭）、<b>元寇</b>、<b>日明貿易</b>（勘合）。','近世：<b>南蛮貿易</b>（ポルトガル・スペイン）、<b>朱印船貿易</b>、<b>鎖国</b>（オランダ・中国・朝鮮通信使・琉球・アイヌ）。','近代：開国、不平等条約とその改正、日清・日露戦争。'],
 t:['「誰が・どこの国と・何を輸入／輸出したか」をセットにする（日明貿易：銅銭を輸入）。','勘合＝正式な貿易船と<b>倭寇</b>を区別するための合い札。','鎖国中の4つの窓口：長崎（オランダ・中国）、対馬（朝鮮）、薩摩（琉球）、松前（アイヌ）。','1543年 種子島に<b>鉄砲</b>、1549年 <b>ザビエル</b>がキリスト教を伝える。'],
 m:['宋銭・明銭は日本で貨幣として流通した。','<i>「以後予算（1543）増える鉄砲」</i>']},
bunka:{k:['<b>天平文化</b>（奈良）：東大寺・正倉院・万葉集・国際色豊か。','<b>国風文化</b>（平安）：かな文字・源氏物語・枕草子・寝殿造・平等院鳳凰堂。','<b>鎌倉文化</b>：武士の力強さ（東大寺南大門・金剛力士像・平家物語）、新しい仏教。','<b>室町文化</b>：北山（金閣・能）、東山（銀閣・<b>書院造</b>・水墨画）。','<b>桃山文化</b>：城（天守閣）・<b>狩野永徳</b>・茶の湯（千利休）。<b>元禄</b>・<b>化政</b>文化。'],
 t:['写真・作品と時代を結びつける問題が多い。「誰の作品か」「何文化か」をセットに。','書院造は今の<b>和室</b>のもと（たたみ・床の間・ふすま）。','鎌倉仏教：浄土宗（法然）、浄土真宗（親鸞）、時宗（一遍）、日蓮宗（日蓮）、禅宗（栄西・道元）。','国学（本居宣長）・蘭学（杉田玄白「解体新書」）。'],
 m:['金閣＝足利義満（北山）、銀閣＝足利義政（東山）。','<i>「ばかでかい天守閣」＝桃山文化</i>']},
shiryo:{k:['資料問題は<b>資料のタイトル・年・出典</b>から時代を判断する。','史料（古い文書）は、キーワード（「御恩」「徳政」「楽市」など）から何の資料かを特定する。'],
 t:['グラフは「いつから増えた／減ったか」を見て、その時期のできごとと結びつける（例：1905年以降の増加 → 日露戦争後）。','選択肢の正誤は、<b>年代と数字</b>を1つずつ確かめる。','記述は「資料から読み取れること」＋「その理由・背景（習った知識）」の2つを書く。','字数指定があるときは、指定の言葉を必ず使う。'],
 m:['資料に書いていないことは選ばない。','<i>「読み取り」と「知識」を分けて考える</i>']},
jinken:{k:['日本国憲法の三大原則：<b>国民主権・基本的人権の尊重・平和主義</b>。','基本的人権：<b>平等権</b>、<b>自由権</b>（精神・身体・経済活動）、<b>社会権</b>（<b>生存権</b>・教育を受ける権利・勤労の権利・労働基本権）、<b>参政権</b>、<b>請求権</b>。','<b>新しい人権</b>：環境権・知る権利・プライバシーの権利・自己決定権。','人権は<b>公共の福祉</b>によって制限されることがある。'],
 t:['人権の歴史：<b>ロック</b>（抵抗権）・<b>モンテスキュー</b>（三権分立）・<b>ルソー</b>（人民主権）→ アメリカ独立宣言・<b>フランス人権宣言</b> → <b>ワイマール憲法</b>（初めて社会権）→ 世界人権宣言。','<b>法の支配</b>：法によって政府の権力を制限する（↔ 人の支配）。<b>立憲主義</b>。','天皇は日本国の<b>象徴</b>。<b>国事行為</b>は<b>内閣の助言と承認</b>が必要。','憲法改正：各議院の総議員の<b>3分の2以上</b>の賛成で発議 → 国民投票で<b>過半数</b>。'],
 m:['社会権＝「人間らしく生きる」権利、自由権＝「国から干渉されない」権利。','<i>ワイマール憲法（ドイツ・1919年）は社会権の最初</i>']},
sanken:{k:['<b>三権分立</b>：立法（国会）・行政（内閣）・司法（裁判所）。','国会：<b>国権の最高機関</b>・<b>唯一の立法機関</b>。衆議院（任期4年・解散あり）、参議院（任期6年・3年ごとに半数改選）。','<b>衆議院の優越</b>：予算の先議、法律案・予算・条約・首相の指名の議決、内閣不信任決議。','<b>議院内閣制</b>：内閣は国会の信任のもとに成立し、国会に対して連帯して責任を負う。'],
 t:['国会の種類：<b>常会</b>（毎年1月・予算）、<b>臨時会</b>、<b>特別会</b>（総選挙後30日以内・首相の指名）。','内閣不信任決議 → 10日以内に衆議院を<b>解散</b>するか<b>総辞職</b>。','裁判：民事・刑事。<b>三審制</b>（控訴・上告）。<b>裁判員制度</b>：重大な<b>刑事</b>裁判の第一審、裁判員6人・裁判官3人。','<b>違憲審査権</b>：すべての裁判所がもつ。最高裁判所は「<b>憲法の番人</b>」。'],
 m:['衆議院の優越は「任期が短く解散があり、国民の意思を反映しやすい」から。','刑事裁判の原則：<b>推定無罪</b>・黙秘権・令状主義。']},

const PW=1240,PH=1754;
/* ===== テーマ別対策：設問ごとに、解説のキーワードの点数がいちばん高いテーマにだけ入れる ===== */
const stripTags=s=>String(s).replace(/<[^>]+>/g,'');
const gre=t=>t._g||(t._g=new RegExp(t.re.source,'g'));
function tscore(t,ans,exp){
  const bold=(String(exp).match(/<b>.*?<\/b>/g)||[]).join(' ');
  const c=s=>{const m=stripTags(s).match(gre(t));return m?new Set(m).size:0};
  return c(ans)*3+c(bold)*2+c(exp);
}
function classify(q,f){
  const out=new Set(),ts=THEMES.filter(t=>t.f===f),groups={};
  for(const t of ts){
    if(t.g==='S'){ if(t.re.test(stripTags(q[4]))||t.re.test(stripTags(q[3]))) out.add(t.id); continue; }
    (groups[t.g]=groups[t.g]||[]).push([t.id,tscore(t,q[3],q[4])]);
  }
  for(const [g,arr] of Object.entries(groups)){
    const best=Math.max(...arr.map(a=>a[1]));
    if(best<(g==='top2'?3:1)) continue;
    arr.forEach(([id,sc])=>{ if(sc===best) out.add(id); });
  }
  return out;
}
const ALLQ=[];
for(const s of SUBJECTS) for(let n=1;n<=s.n;n++){ const id=`${s.key}-${n}`,u=UNITS[id]; if(!u) continue;
  u.pages.forEach((pg,pi)=>(pg.qs||[]).forEach((q,qi)=>{ if(q[5]) return; ALLQ.push({id,n,s,pi,qi,pg,q,th:classify(q,s.key)}); })); }
const themeItems=t=>ALLQ.filter(it=>it.th.has(t.id));
const THEME_COUNT={}; THEMES.forEach(t=>THEME_COUNT[t.id]=themeItems(t).length);
function cropHTML(it,seen){
  const R=(window.THEME_CROPS||{})[`${it.id}@${it.pi}@${it.qi}`];
  if(R){ // 設問に必要な部分（リード・図・設問）だけを切り出して縦にならべる。[y0,y1] か 別ページなら [y0,y1,ページ]
    const X0=0.06,XW=0.9;
    return R.map(([a,b,pp],k)=>{ const img=pp==null?it.pg.img:UNITS[it.id].pages[pp].img, key=img+':'+a+'-'+b;
      if(seen&&k<R.length-1&&seen.has(key)) return `<p class="same">↑ 実験・資料は上と同じ（「ページ全体で見る」でも見られます）</p>`;
      if(seen) seen.add(key);
      return `<div class="crop" style="padding-top:${((b-a)/(PW*XW)*100).toFixed(2)}%"><img src="${img}" alt="" loading="lazy" style="width:${(100/XW).toFixed(3)}%;left:-${(X0/XW*100).toFixed(3)}%;transform:translateY(-${(a/PH*100).toFixed(3)}%)"></div>`;}).join('');
  }
  const y=it.q[2], nexts=it.pg.qs.map(x=>x[2]).filter(v=>v>y+15).sort((a,b)=>a-b);
  const y0=Math.max(0,y-24), y1=Math.min(PH-20, nexts.length?nexts[0]-22:y+420), h=Math.max(60,Math.min(y1-y0,nexts.length?700:420));
  const X0=0.06,XW=0.9; // 左右の余白を切って少し大きく見せる
  return `<div class="crop" style="padding-top:${(h/(PW*XW)*100).toFixed(2)}%"><img src="${it.pg.img}" alt="" loading="lazy" style="width:${(100/XW).toFixed(3)}%;left:-${(X0/XW*100).toFixed(3)}%;transform:translateY(-${(y0/PH*100).toFixed(3)}%)"></div>`;
}

  <div class="sheet">
    <img src="${p.img}" alt="${s.name}の${CIRC[n-1]} ${p.label}" width="1240" height="1754">
    ${hasK?`<svg viewBox="0 0 1240 1754" aria-hidden="true">${DEFS}${state.kaisetsu?p.svg.join(''):''}${(p.skip||[]).join('')}</svg>`:''}
    ${state.kaisetsu?(p.qs||[]).map((q,i)=>`<button class="qb${q[5]?' skip':''}" data-q="${i}" aria-pressed="false" style="left:${q[1]/12.40}%;top:${q[2]/17.54}%">${q[5]?'✕ ':''}${q[0]}${q[6]?'<span class="hard">ムズ</span>':''}</button>`).join(''):''}
  ${(!state.kaisetsu&&state.mark!=null&&state.markPage===state.page&&p.qs&&p.qs[state.mark])?`<div class="qmark" id="qmark" style="top:${p.qs[state.mark][2]/17.54}%">ここ ▶ ${p.qs[state.mark][0]}</div>`:''}
  </div>
  ${state.kaisetsu?`<aside class="panel empty" id="panel" aria-live="polite"></aside>`:''}
  </div>`;
  document.getElementById('back').onclick=()=>{location.hash=route.from||''};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{state.page=+b.dataset.p;unit(id)});
  if(state.kaisetsu){
    const panel=document.getElementById('panel'),btns=[...app.querySelectorAll('.qb')];
    const show=i=>{
      btns.forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));
      if(i<0){panel.className='panel empty';panel.innerHTML='<h3>解説</h3><p class="hint">問題番号の青いボタンをおすと、ここに解説が出るよ。</p>';return}
      const q=p.qs[i];panel.className='panel';
      panel.innerHTML=`<h3>${q[0]}${q[6]?' <small class="hard" style="font-size:12px;background:#1e9a4a;color:#fff;border-radius:6px;padding:0 6px">ムズ</small>':''}<button id="pclose" aria-label="閉じる">✕</button></h3>`+
        (q[5]?`<p class="a skipa">✕ ${q[3]}</p>`:`<p class="a">こたえ：${q[3]}</p>`)+`<p class="exp">${q[4]}</p>`;
      document.getElementById('pclose').onclick=()=>show(-1);
    };
    let cur=-1;
    btns.forEach((b,i)=>b.onclick=()=>{cur=(cur===i)?-1:i;show(cur);});
    show(-1);
  }
  const kb=document.getElementById('kbtn'); if(kb) kb.onclick=()=>{state.kaisetsu=!state.kaisetsu;unit(id)};
}

function route(){
  const h=location.hash.slice(1),[id,pp,qq]=h.split('@');
  if(h==='themes'){ route.last=null; route.from=null; renderThemes(); window.scrollTo(0,0); return; }
  if(h.startsWith('theme-')&&THEMES.some(t=>t.id===h.slice(6))){ route.last=null; renderTheme(h.slice(6)); window.scrollTo(0,0); return; }
  if(UNITS[id]){
    if(route.last!==h){ state={page:+pp||0,kaisetsu:false,mark:qq!=null?+qq:null,markPage:+pp||0}; if(pp==null&&!route.keep) route.from=null; }
    route.last=h; unit(id);
    const mk=document.getElementById('qmark');
    if(mk){ const y=mk.getBoundingClientRect().top+scrollY; window.scrollTo(0,Math.max(0,y-innerHeight*0.3)); } else window.scrollTo(0,0);
    return;
  }
  route.last=null; route.from=null; renderTop(); window.scrollTo(0,0);
}
addEventListener('hashchange',route); route();
</script>
